<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // Aggressive, blocking cache-buster script executed before page load
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for (let registration of registrations) {
                    registration.unregister();
                }
            });
        }
        if ('caches' in window) {
            caches.keys().then(keys => {
                keys.forEach(key => caches.delete(key));
            });
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSK-Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f2f0ec'/%3E%3Crect x='0' y='0' width='4' height='32' rx='2' fill='%233654d1'/%3E%3Ctext x='18' y='22' font-family='Arial%2C sans-serif' font-size='14' font-weight='bold' fill='%2324211d' text-anchor='middle' letter-spacing='-0.5'%3EMSK%3C/text%3E%3C/svg%3E">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f2f0ec">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f2f0ec;
            color: #24211d;
            padding: 20px;
            line-height: 1.5;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #e4e0d6;
            padding-bottom: 15px;
        }

        h1 {
            font-size: 1.4rem;
            color: #3654d1;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background-color: #3654d1;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            box-shadow: 0 1px 2px rgba(54, 84, 209, 0.35);
        }

        .btn:hover { background-color: #2a41a8; }

        .btn-secondary {
            background-color: #ffffff;
            border: 1px solid #e4e0d6;
            color: #24211d;
            box-shadow: none;
        }
        .btn-secondary:hover { background-color: #eef0fb; border-color: #3654d1; color: #3654d1; }

        .category-section {
            margin-bottom: 30px;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            cursor: grab;
        }

        /* Applied to a whole category section while you're dragging it
           to a new position (parallels .card.dragging above). */
        .category-section.dragging-category {
            opacity: 0.4;
        }

        .category-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            color: #9c5e26;
            padding-left: 8px;
            border-left: 3px solid #3654d1;
            line-height: 1;
        }

        .category-edit-link {
            font-size: 0.75rem;
            color: #3654d1;
            text-transform: none;
            letter-spacing: normal;
            cursor: pointer;
            background: none;
            border: none;
        }
        .category-edit-link:hover { text-decoration: underline; color: #2a41a8; }

        /* Delete uses a different hover color (red) so it reads as a destructive action */
        .category-edit-link.delete-cat:hover { color: #b3261e; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .card {
            background-color: #ffffff;
            border: 1px solid #e4e0d6;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            position: relative;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
            box-shadow: 0 1px 3px rgba(36, 33, 29, 0.06);
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #3654d1;
            box-shadow: 0 4px 10px rgba(36, 33, 29, 0.1);
        }

        /* Applied to a card while it is being dragged, so it's obvious
           which one you're moving. The rest of the cards shuffle live
           around it as you drag over them. */
        .card.dragging {
            opacity: 0.4;
            border-style: dashed;
            border-color: #3654d1;
        }

        .card-title {
            font-size: 1rem;
            font-weight: bold;
            color: #24211d;
            margin-bottom: 5px;
        }

        .card-url {
            font-size: 0.75rem;
            color: #79746a;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .card-type {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #3654d1;
            background: rgba(54, 84, 209, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            align-self: center;
        }

        .card-actions {
            position: absolute;
            top: 5px;
            right: 5px;
            display: none;
            gap: 4px;
            background: #ffffff;
            border-radius: 4px;
            padding: 2px;
        }

        .card:hover .card-actions {
            display: flex;
        }

        .action-icon-btn {
            background: none;
            border: none;
            color: #c7c2b4;
            font-size: 1rem;
            cursor: pointer;
            padding: 2px 4px;
            line-height: 1;
        }

        .action-icon-btn.edit-btn:hover { color: #3654d1; }
        .action-icon-btn.delete-btn:hover { color: #b3261e; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(36, 33, 29, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #ffffff;
            border: 1px solid #e4e0d6;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 8px 24px rgba(36, 33, 29, 0.15);
        }

        .modal h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #24211d;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #79746a;
            margin-bottom: 4px;
        }

        .form-group input, .form-group select {
            width: 100%;
            background: #f2f0ec;
            border: 1px solid #e4e0d6;
            color: #24211d;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #3654d1;
            box-shadow: 0 0 0 3px rgba(54, 84, 209, 0.15);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>MSK-Dashboard</h1>
        <div class="header-actions">
            <button class="btn btn-secondary" id="exportBtn" title="Export Config">Export</button>
            <button class="btn btn-secondary" id="importBtn" title="Import Config">Import</button>
            <input type="file" id="fileInput" accept=".json">
            <!-- New: lets the user create a brand new category from anywhere, not tied to a specific section -->
            <button class="btn btn-secondary" id="addCategoryBtn" title="Add a new category">+ Add Category</button>
            <button class="btn" id="addAppBtn">+ Add App</button>
        </div>
    </header>

    <main id="dashboardContainer"></main>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">Add Application</h2>
            <form id="appForm">
                <input type="hidden" id="editAppId">
                <div class="form-group">
                    <label for="appName">App Name</label>
                    <input type="text" id="appName" required placeholder="e.g., Soda Counter">
                </div>
                <div class="form-group">
                    <label for="appUrl">URL</label>
                    <input type="url" id="appUrl" required placeholder="https://your-app.netlify.app">
                </div>
                <div class="form-group">
                    <label for="appCategory">Category</label>
                    <!--
                        This dropdown used to have 3 hardcoded options.
                        Now it starts empty and gets filled in automatically by
                        populateCategoryDropdown() so it always matches whatever
                        categories actually exist (including new/deleted ones).
                    -->
                    <select id="appCategory"></select>
                </div>
                <div class="form-group">
                    <label for="windowType">Window Mode</label>
                    <select id="windowType">
                        <option value="popup">Compact Utility Window</option>
                        <option value="tab">Standard Browser Tab</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn" id="saveFormBtn">Save App</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const defaultApps = [
            { id: "1", name: "Dew Counter", url: "https://your-counter-app.netlify.app", category: "local", type: "popup" }
        ];

        let apps = [];

        // While a card is being dragged, this remembers which category grid
        // it came from. We check this in the grid's dragover/drop handlers
        // so a card can only be reordered within its own category, never
        // dropped into a different category's grid by accident.
        let draggedFromCategory = null;

        // Same idea, but for dragging a whole category section to reorder
        // categories themselves. Kept separate from draggedFromCategory so
        // dragging a card and dragging a category header never get confused
        // with each other.
        let draggedCategoryKey = null;

        // categoryLabels is now the SINGLE source of truth for which categories exist.
        // Whatever keys exist in this object ARE the categories. Add a key = new category.
        // Delete a key = category gone. Nothing else needs to be touched.
        let categoryLabels = {
            local: "Local PWAs",
            tools: "Dev Tools / Assets",
            external: "External / Cloud"
        };

        function loadCategories() {
            const savedCats = localStorage.getItem('dashboardCategories');
            if (savedCats) {
                categoryLabels = JSON.parse(savedCats);
            }
        }

        function saveCategories() {
            localStorage.setItem('dashboardCategories', JSON.stringify(categoryLabels));
        }

        // Turns a typed category name like "Side Projects!" into a safe internal
        // key like "side-projects" that we can use as an object property and
        // store on each app. The label shown on screen stays exactly as typed;
        // this slug is just the internal "id" for the category.
        function slugifyCategoryName(name) {
            const base = name
                .trim()
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/(^-|-$)/g, '');
            return base || 'category';
        }

        // Makes sure a new category's internal key doesn't collide with an
        // existing one. If "side-projects" is taken, tries "side-projects-2", etc.
        function getUniqueCategoryKey(baseSlug) {
            let slug = baseSlug;
            let counter = 2;
            while (Object.prototype.hasOwnProperty.call(categoryLabels, slug)) {
                slug = `${baseSlug}-${counter}`;
                counter++;
            }
            return slug;
        }

        // Rebuilds the "Category" dropdown in the Add/Edit App form so it always
        // matches the current set of categories. Called on page load and any
        // time a category is added or deleted.
        function populateCategoryDropdown() {
            const select = document.getElementById('appCategory');
            const previousValue = select.value;
            select.innerHTML = '';

            Object.keys(categoryLabels).forEach(key => {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = categoryLabels[key];
                select.appendChild(option);
            });

            // Try to keep whatever was selected before, if it still exists
            if (Object.prototype.hasOwnProperty.call(categoryLabels, previousValue)) {
                select.value = previousValue;
            }
        }

        function loadApps() {
            const saved = localStorage.getItem('dashboardAppsGrid');
            if (saved) {
                apps = JSON.parse(saved);
            } else {
                apps = [...defaultApps];
                saveApps();
            }
            renderDashboard();
        }

        function saveApps() {
            localStorage.setItem('dashboardAppsGrid', JSON.stringify(apps));
        }

        // --- Drag-and-drop reordering helpers ---

        // While dragging, this figures out which existing card the mouse is
        // closest to, so we know where to slot the dragged card in. Cards
        // sit in a CSS grid (multiple columns), so we can't just compare
        // vertical position like a simple list - we compare distance to the
        // center of every other card and also check whether that card is
        // "ahead of" the cursor (further down, or same row but further right).
        // Whatever this returns is where the dragged card gets inserted
        // BEFORE. If it returns null, the dragged card goes at the very end.
        function getDragAfterElement(grid, mouseX, mouseY) {
            const otherCards = [...grid.querySelectorAll('.card:not(.dragging)')];

            let closest = { distance: Infinity, element: null };

            otherCards.forEach(card => {
                const box = card.getBoundingClientRect();
                const centerX = box.left + box.width / 2;
                const centerY = box.top + box.height / 2;

                // Is this card positioned after the cursor? Either it's in a
                // lower row, or it's in roughly the same row but to the right.
                const sameRow = Math.abs(centerY - mouseY) <= box.height / 2;
                const isAfterCursor = (centerY > mouseY) || (sameRow && centerX > mouseX);

                if (isAfterCursor) {
                    const distance = Math.hypot(centerX - mouseX, centerY - mouseY);
                    if (distance < closest.distance) {
                        closest = { distance, element: card };
                    }
                }
            });

            return closest.element;
        }

        // Once a card is dropped, the DOM order inside that category's grid
        // is already the new order (we moved elements live during dragover).
        // This reads that DOM order and rewrites the `apps` array so the
        // saved order matches what's on screen.
        //
        // categoryAppIds is the list of app ids that belonged to this
        // category at the time it was rendered. We use that (rather than
        // re-checking each app's `category` field) so this still works
        // correctly for apps that landed in a category via the "fallback"
        // safety net in renderDashboard.
        function syncCategoryOrderFromDOM(grid, categoryAppIds) {
            const newIdOrder = [...grid.querySelectorAll('.card')].map(card => card.dataset.id);
            const idsInThisCategory = new Set(categoryAppIds);

            let nextIndex = 0;
            apps = apps.map(app => {
                if (!idsInThisCategory.has(app.id)) {
                    return app; // untouched, belongs to a different category
                }
                const idForThisSlot = newIdOrder[nextIndex];
                nextIndex++;
                return apps.find(a => a.id === idForThisSlot);
            });

            saveApps();
        }

        // --- Category reordering helpers (separate from the app-card ones above) ---

        // Categories stack one per row, so unlike the app grid we only need
        // to compare vertical position to know where a dragged category
        // should land - no left/right column math needed.
        function getCategoryDragAfterElement(container, mouseY) {
            const otherSections = [...container.querySelectorAll('.category-section:not(.dragging-category)')];

            let closest = { offset: -Infinity, element: null };

            otherSections.forEach(section => {
                const box = section.getBoundingClientRect();
                const offset = mouseY - box.top - box.height / 2;
                // We only want sections whose center is below the cursor
                // (offset < 0), and of those, the nearest one.
                if (offset < 0 && offset > closest.offset) {
                    closest = { offset, element: section };
                }
            });

            return closest.element;
        }

        // Once a category section is dropped in its new spot, the DOM order
        // of .category-section elements is already correct (we moved it
        // live during dragover). This rebuilds categoryLabels with that same
        // key order and saves it, so the new arrangement survives a reload.
        function syncCategoryListOrderFromDOM(container) {
            const orderedKeys = [...container.querySelectorAll('.category-section')]
                .map(section => section.dataset.catKey);

            const reordered = {};
            orderedKeys.forEach(key => {
                reordered[key] = categoryLabels[key];
            });
            categoryLabels = reordered;
            saveCategories();
        }

        function renderDashboard() {
            const container = document.getElementById('dashboardContainer');
            container.innerHTML = '';

            // Categories are now built dynamically from categoryLabels instead of
            // a fixed { local, tools, external } object. This is the key change
            // that makes add/delete actually possible.
            const categoryKeys = Object.keys(categoryLabels);
            const groups = {};
            categoryKeys.forEach(key => { groups[key] = []; });

            // If an app's category somehow doesn't exist anymore (shouldn't normally
            // happen since delete reassigns apps, but this is a safety net), drop it
            // into the first available category instead of losing it from view.
            const fallbackKey = categoryKeys[0];
            apps.forEach(app => {
                if (groups[app.category]) {
                    groups[app.category].push(app);
                } else if (fallbackKey) {
                    groups[fallbackKey].push(app);
                }
            });

            categoryKeys.forEach(catKey => {
                const catGroup = groups[catKey];
                
                const sect = document.createElement('section');
                sect.className = 'category-section';
                // Used by syncCategoryListOrderFromDOM to read the new
                // category order straight off the DOM after a drop.
                sect.dataset.catKey = catKey;

                const catHeader = document.createElement('div');
                catHeader.className = 'category-header';

                // The header bar is the drag handle for reordering whole
                // categories. We deliberately don't make the entire section
                // draggable, so clicking around inside the grid (to open an
                // app, etc.) never gets mistaken for a drag.
                catHeader.draggable = true;
                catHeader.addEventListener('dragstart', () => {
                    sect.classList.add('dragging-category');
                    draggedCategoryKey = catKey;
                });
                catHeader.addEventListener('dragend', () => {
                    sect.classList.remove('dragging-category');
                    draggedCategoryKey = null;
                });

                const title = document.createElement('div');
                title.className = 'category-title';
                title.textContent = categoryLabels[catKey] || catKey;
                catHeader.appendChild(title);

                // --- Rename button (unchanged from before) ---
                const renameLink = document.createElement('button');
                renameLink.className = 'category-edit-link';
                renameLink.textContent = '✎ Rename';
                renameLink.draggable = false;
                renameLink.addEventListener('click', () => {
                    const currentName = categoryLabels[catKey];
                    const newName = prompt(`Enter new name for category "${currentName}":`, currentName);
                    if (newName && newName.trim() !== "") {
                        categoryLabels[catKey] = newName.trim();
                        saveCategories();
                        renderDashboard();
                    }
                });
                catHeader.appendChild(renameLink);

                // --- New: Delete button for this category ---
                const deleteCatLink = document.createElement('button');
                deleteCatLink.className = 'category-edit-link delete-cat';
                deleteCatLink.textContent = '🗑 Delete';
                deleteCatLink.draggable = false;
                deleteCatLink.addEventListener('click', () => {
                    const allKeys = Object.keys(categoryLabels);

                    // Block deleting the very last category. Every app needs
                    // somewhere to live, so we always require at least one.
                    if (allKeys.length <= 1) {
                        alert('At least one category must remain. Add another category before deleting this one.');
                        return;
                    }

                    const appsInThisCategory = apps.filter(a => a.category === catKey);
                    const fallbackCatKey = allKeys.find(k => k !== catKey);
                    const fallbackCatLabel = categoryLabels[fallbackCatKey];

                    let confirmMessage;
                    if (appsInThisCategory.length > 0) {
                        confirmMessage = `"${categoryLabels[catKey]}" contains ${appsInThisCategory.length} app(s). ` +
                            `Deleting it will move ${appsInThisCategory.length > 1 ? 'them' : 'it'} into "${fallbackCatLabel}". Continue?`;
                    } else {
                        confirmMessage = `Delete the empty category "${categoryLabels[catKey]}"?`;
                    }

                    if (!confirm(confirmMessage)) return;

                    // Move any apps out of the category being deleted, so nothing
                    // disappears from the dashboard.
                    if (appsInThisCategory.length > 0) {
                        apps = apps.map(a =>
                            a.category === catKey ? { ...a, category: fallbackCatKey } : a
                        );
                        saveApps();
                    }

                    // Now it's safe to remove the category itself.
                    delete categoryLabels[catKey];
                    saveCategories();

                    populateCategoryDropdown();
                    renderDashboard();
                });
                catHeader.appendChild(deleteCatLink);

                sect.appendChild(catHeader);

                if (catGroup.length === 0) {
                    const emptyMsg = document.createElement('div');
                    emptyMsg.style.cssText = 'font-size:0.8rem; color:#c7c2b4; padding-left:8px; font-style:italic;';
                    emptyMsg.textContent = 'No applications mapped to this segment.';
                    sect.appendChild(emptyMsg);
                    container.appendChild(sect);
                    return;
                }

                const grid = document.createElement('div');
                grid.className = 'grid';

                catGroup.forEach(app => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const cleanUrl = app.url.replace(/^https?:\/\//, '');

                    // draggable + data-id are what make this card reorderable.
                    // data-id lets syncCategoryOrderFromDOM read the new order
                    // straight off the DOM after a drop.
                    card.draggable = true;
                    card.dataset.id = app.id;

                    card.innerHTML = `
                        <div class="card-actions" draggable="false">
                            <button class="action-icon-btn edit-btn" data-id="${app.id}" title="Edit App">✎</button>
                            <button class="action-icon-btn delete-btn" data-id="${app.id}" title="Remove App">&times;</button>
                        </div>
                        <div>
                            <div class="card-title">${app.name}</div>
                            <div class="card-url">${cleanUrl}</div>
                        </div>
                        <div class="card-type">${app.type === 'popup' ? 'Utility' : 'Tab'}</div>
                    `;

                    card.addEventListener('click', (e) => {
                        if (e.target.closest('.card-actions')) return;
                        
                        if (app.type === 'popup') {
                            window.open(
                                app.url, 
                                `win_${app.id}`, 
                                "width=320,height=500,noopener=yes,noreferrer=yes,resizable=yes"
                            );
                        } else {
                            window.open(app.url, '_blank');
                        }
                    });

                    // --- Drag handlers for this card ---
                    card.addEventListener('dragstart', () => {
                        card.classList.add('dragging');
                        draggedFromCategory = catKey;
                    });

                    card.addEventListener('dragend', () => {
                        card.classList.remove('dragging');
                        draggedFromCategory = null;
                    });

                    grid.appendChild(card);
                });

                // --- Drag handlers for the grid itself (one category's worth of cards) ---
                // dragover fires repeatedly as the mouse moves over the grid; we use
                // it to live-shuffle the dragged card to its prospective new spot,
                // which is the same "things slide out of the way" feel most
                // drag-and-drop lists have.
                grid.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (draggedFromCategory !== catKey) return; // ignore drags from other categories

                    const dragging = grid.querySelector('.dragging');
                    if (!dragging) return;

                    const afterElement = getDragAfterElement(grid, e.clientX, e.clientY);
                    if (afterElement == null) {
                        grid.appendChild(dragging);
                    } else {
                        grid.insertBefore(dragging, afterElement);
                    }
                });

                grid.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (draggedFromCategory !== catKey) return;

                    // catGroup is exactly the set of apps that were in this
                    // category when we rendered it, which is what we need to
                    // correctly rewrite their order in the apps array.
                    syncCategoryOrderFromDOM(grid, catGroup.map(a => a.id));
                });

                sect.appendChild(grid);
                container.appendChild(sect);
            });

            // Bind Delete Events
            document.querySelectorAll('.action-icon-btn.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idToKill = btn.getAttribute('data-id');
                    if (confirm('Remove this application link?')) {
                        apps = apps.filter(a => a.id !== idToKill);
                        saveApps();
                        renderDashboard();
                    }
                });
            });

            // Bind Edit Events
            document.querySelectorAll('.action-icon-btn.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idToEdit = btn.getAttribute('data-id');
                    const targetApp = apps.find(a => a.id === idToEdit);
                    if (targetApp) {
                        openModalForEdit(targetApp);
                    }
                });
            });
        }

        // Modal Operations
        const modal = document.getElementById('modalOverlay');
        const appForm = document.getElementById('appForm');

        document.getElementById('addAppBtn').addEventListener('click', () => {
            document.getElementById('modalTitle').textContent = "Add Application";
            document.getElementById('editAppId').value = "";
            appForm.reset();
            populateCategoryDropdown(); // make sure dropdown reflects latest categories
            modal.classList.add('active');
        });

        document.getElementById('cancelBtn').addEventListener('click', () => {
            modal.classList.remove('active');
            appForm.reset();
        });

        // New: handles the "+ Add Category" button in the header
        document.getElementById('addCategoryBtn').addEventListener('click', () => {
            const name = prompt('Enter a name for the new category:');
            if (!name || name.trim() === '') return;

            const baseSlug = slugifyCategoryName(name);
            const uniqueKey = getUniqueCategoryKey(baseSlug);

            categoryLabels[uniqueKey] = name.trim();
            saveCategories();
            populateCategoryDropdown();
            renderDashboard();
        });

        function openModalForEdit(app) {
            document.getElementById('modalTitle').textContent = "Edit Application";
            document.getElementById('editAppId').value = app.id;
            document.getElementById('appName').value = app.name;
            document.getElementById('appUrl').value = app.url;
            populateCategoryDropdown(); // refresh options before setting the value below
            document.getElementById('appCategory').value = app.category;
            document.getElementById('windowType').value = app.type;
            modal.classList.add('active');
        }

        appForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const appId = document.getElementById('editAppId').value;
            
            const appData = {
                name: document.getElementById('appName').value,
                url: document.getElementById('appUrl').value,
                category: document.getElementById('appCategory').value,
                type: document.getElementById('windowType').value
            };

            if (appId) {
                // Update Existing
                apps = apps.map(a => a.id === appId ? { ...a, ...appData } : a);
            } else {
                // Insert New
                apps.push({
                    id: Date.now().toString(),
                    ...appData
                });
            }

            saveApps();
            renderDashboard();
            modal.classList.remove('active');
            appForm.reset();
        });

        // Backup Actions
        document.getElementById('exportBtn').addEventListener('click', () => {
            const exportPayload = { apps, categoryLabels };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportPayload, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "control_center_config.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        });

        const fileInput = document.getElementById('fileInput');
        document.getElementById('importBtn').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const importedData = JSON.parse(evt.target.result);
                    if (Array.isArray(importedData)) {
                        if (confirm('Overwrite config grid with standard asset array?')) {
                            apps = importedData;
                            saveApps();
                            renderDashboard();
                        }
                    } else if (importedData.apps && importedData.categoryLabels) {
                        if (confirm('Overwrite launchpad apps and layout categories completely?')) {
                            apps = importedData.apps;
                            categoryLabels = importedData.categoryLabels;
                            saveApps();
                            saveCategories();
                            populateCategoryDropdown();
                            renderDashboard();
                        }
                    } else {
                        alert('Invalid configuration format detected.');
                    }
                } catch (err) {
                    alert('Error parsing uploaded layout content.');
                }
                fileInput.value = '';
            };
            reader.readAsText(file);
        });

        // --- Category drag listeners (registered once, not per render) ---
        // These live on the outer dashboard container, since category
        // sections are its direct children. We check draggedCategoryKey so
        // these only act during a category drag, never during an app-card
        // drag (which is handled separately by each grid's own listeners).
        const dashboardContainer = document.getElementById('dashboardContainer');

        dashboardContainer.addEventListener('dragover', (e) => {
            if (!draggedCategoryKey) return;
            e.preventDefault();

            const draggingSection = dashboardContainer.querySelector('.dragging-category');
            if (!draggingSection) return;

            const afterElement = getCategoryDragAfterElement(dashboardContainer, e.clientY);
            if (afterElement == null) {
                dashboardContainer.appendChild(draggingSection);
            } else {
                dashboardContainer.insertBefore(draggingSection, afterElement);
            }
        });

        dashboardContainer.addEventListener('drop', (e) => {
            if (!draggedCategoryKey) return;
            e.preventDefault();
            syncCategoryListOrderFromDOM(dashboardContainer);
        });

        loadCategories();
        populateCategoryDropdown();
        loadApps();
    </script>
</body>
</html>
