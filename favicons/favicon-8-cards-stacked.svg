<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#1e1e1e"/>
  <!-- Back card (offset) -->
  <rect x="9" y="6" width="18" height="13" rx="2" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Middle card -->
  <rect x="6" y="9" width="18" height="13" rx="2" fill="#252525" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Front card (teal accent) -->
  <rect x="3" y="12" width="18" height="14" rx="2" fill="#252525" stroke="#00adb5" stroke-width="1.5"/>
  <!-- Teal dot/icon on front card -->
  <circle cx="9" cy="18" r="2.5" fill="#00adb5"/>
  <!-- Text lines on front card -->
  <rect x="14" y="16" width="5" height="1.5" rx="0.5" fill="#555"/>
  <rect x="14" y="20" width="4" height="1.5" rx="0.5" fill="#555"/>
</svg>
