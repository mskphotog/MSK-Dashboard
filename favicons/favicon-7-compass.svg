<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#1e1e1e"/>
  <!-- Outer teal ring -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#00adb5" stroke-width="1.5"/>
  <!-- Inner dark circle -->
  <circle cx="16" cy="16" r="9" fill="#252525"/>
  <!-- Compass needle up (teal) -->
  <path d="M16 7 L14 16 L16 14 L18 16 Z" fill="#00adb5"/>
  <!-- Compass needle down (muted) -->
  <path d="M16 25 L18 16 L16 18 L14 16 Z" fill="#555"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#00adb5"/>
</svg>
