<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ollama Chat</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f2f0ec'/%3E%3Cpolyline points='7,25 7,7 16,17 25,7 25,25' fill='none' stroke='%233654d1' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
    // Same key as the dashboard, so one theme choice carries across every
    // page in the product. Applied before paint to avoid a flash.
    try {
        const stored = localStorage.getItem('dashboardTheme');
        if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
        }
    } catch (e) { /* localStorage unavailable; fall back to system preference */ }
</script>
<style>
    /* Tokens are duplicated per page by design: this project ships every
       page as a self-contained file with no build step and no shared
       stylesheet. See DESIGN.md for the canonical values. */
    :root {
        --paper: #f2f0ec;
        --surface: #ffffff;
        --sunken: #f2f0ec;
        --ink: #24211d;
        --rule: #cdc4ae;
        --rule-soft: #e4e0d6;
        --muted: #79746a;
        --signal: #3654d1;
        --signal-deep: #2a41a8;
        --signal-wash: #eef0fb;
        --patina: #9c5e26;
        --alert: #b3261e;
        --alert-wash: #fbeeed;
        --on-signal: #ffffff;
        --seat: 0 1px 3px rgba(36, 33, 29, 0.06);
        --press: 0 1px 2px rgba(54, 84, 209, 0.35);
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --paper: #1a1815;
            --surface: #24211d;
            --sunken: #1a1815;
            --ink: #f2f0ec;
            --rule: #4a4438;
            --rule-soft: #3a352d;
            --muted: #a39d90;
            --signal: #7b93e8;
            --signal-deep: #9aabee;
            --signal-wash: #262b45;
            --patina: #c98c46;
            --alert: #f2b8b5;
            --alert-wash: #3a2422;
            --on-signal: #1a1815;
            --seat: 0 1px 3px rgba(0, 0, 0, 0.3);
            --press: 0 1px 2px rgba(123, 147, 232, 0.35);
        }
    }

    :root[data-theme="light"] {
        --paper: #f2f0ec;
        --surface: #ffffff;
        --sunken: #f2f0ec;
        --ink: #24211d;
        --rule: #cdc4ae;
        --rule-soft: #e4e0d6;
        --muted: #79746a;
        --signal: #3654d1;
        --signal-deep: #2a41a8;
        --signal-wash: #eef0fb;
        --patina: #9c5e26;
        --alert: #b3261e;
        --alert-wash: #fbeeed;
        --on-signal: #ffffff;
        --seat: 0 1px 3px rgba(36, 33, 29, 0.06);
        --press: 0 1px 2px rgba(54, 84, 209, 0.35);
    }

    :root[data-theme="dark"] {
        --paper: #1a1815;
        --surface: #24211d;
        --sunken: #1a1815;
        --ink: #f2f0ec;
        --rule: #4a4438;
        --rule-soft: #3a352d;
        --muted: #a39d90;
        --signal: #7b93e8;
        --signal-deep: #9aabee;
        --signal-wash: #262b45;
        --patina: #c98c46;
        --alert: #f2b8b5;
        --alert-wash: #3a2422;
        --on-signal: #1a1815;
        --seat: 0 1px 3px rgba(0, 0, 0, 0.3);
        --press: 0 1px 2px rgba(123, 147, 232, 0.35);
    }

    * { box-sizing: border-box; }

    :focus-visible {
        outline: 2px solid var(--signal);
        outline-offset: 2px;
        border-radius: 4px;
    }

    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--paper);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--rule-soft);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    header h1 {
        font-size: 0.9rem;
        margin: 0;
        color: var(--signal);
        font-weight: 600;
        overflow-wrap: anywhere;
    }

    .header-right {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
    }

    /* Status is the only place this page reports what it is doing, so it
       reads as a label rather than as body text. */
    #status {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
    }
    #status[data-state="thinking"] { color: var(--patina); }
    #status[data-state="error"] { color: var(--alert); }

    .icon {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        background: none;
        border: 1px solid transparent;
        border-radius: 6px;
        color: var(--muted);
        cursor: pointer;
        transition: background-color 0.2s, border-color 0.2s, color 0.2s;
    }
    .icon-btn:hover {
        background-color: var(--signal-wash);
        border-color: var(--signal);
        color: var(--signal);
    }

    #messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .msg {
        /* 80% suits the 320px popup this page usually opens in; the ch cap
           keeps the measure readable when it is opened in a full tab. */
        max-width: min(80%, 68ch);
        padding: 10px 14px;
        border-radius: 8px;
        white-space: pre-wrap;
        word-wrap: break-word;
        line-height: 1.5;
        font-size: 0.9rem;
    }

    .msg.user {
        align-self: flex-end;
        background-color: var(--signal);
        color: var(--on-signal);
        box-shadow: var(--press);
    }

    .msg.assistant {
        align-self: flex-start;
        background-color: var(--surface);
        border: 1px solid var(--rule);
        color: var(--ink);
        box-shadow: var(--seat);
    }

    .msg.error {
        align-self: flex-start;
        background-color: var(--alert-wash);
        border: 1px solid var(--alert);
        color: var(--ink);
    }

    form {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--rule-soft);
    }

    textarea {
        flex: 1;
        resize: none;
        background-color: var(--sunken);
        border: 1px solid var(--rule);
        border-radius: 4px;
        color: var(--ink);
        padding: 10px;
        font-family: inherit;
        font-size: 0.9rem;
        min-height: 40px;
    }
    textarea::placeholder { color: var(--muted); }
    textarea:focus {
        outline: none;
        border-color: var(--signal);
        box-shadow: 0 0 0 3px rgba(54, 84, 209, 0.25);
    }

    button[type="submit"] {
        background-color: var(--signal);
        color: var(--on-signal);
        border: 1px solid var(--signal);
        border-radius: 6px;
        padding: 0 18px;
        font-size: 0.9rem;
        font-weight: 500;
        font-family: inherit;
        min-height: 40px;
        cursor: pointer;
        box-shadow: var(--press);
        transition: background-color 0.2s, border-color 0.2s;
    }
    button[type="submit"]:hover {
        background-color: var(--signal-deep);
        border-color: var(--signal-deep);
    }
    button[type="submit"]:disabled {
        background-color: var(--surface);
        border-color: var(--rule);
        color: var(--muted);
        box-shadow: none;
        cursor: default;
    }

    .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
    }
</style>
</head>
<body>
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
        <defs>
            <symbol id="i-sun" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>
            </symbol>
            <symbol id="i-moon" viewBox="0 0 24 24">
                <path d="M20 13.5A8 8 0 0 1 10.5 4a8 8 0 1 0 9.5 9.5z"/>
            </symbol>
        </defs>
    </svg>

    <header>
        <h1 id="pageTitle">gemma3:12b</h1>
        <div class="header-right">
            <span id="status" role="status" aria-live="polite" data-state="idle">idle</span>
            <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch to dark theme">
                <svg class="icon" aria-hidden="true"><use href="#i-moon"></use></svg>
            </button>
        </div>
    </header>
    <div id="messages" role="log" aria-label="Conversation"></div>
    <form id="chatForm">
        <label class="visually-hidden" for="input">Message</label>
        <textarea id="input" rows="1" placeholder="Message..." autofocus></textarea>
        <button type="submit" id="sendBtn">Send</button>
    </form>

<script>
    const MODEL = new URLSearchParams(location.search).get('model') || "gemma3:12b";
    const OLLAMA_URL = "http://localhost:11434/api/chat";

    document.title = MODEL;
    document.getElementById('pageTitle').textContent = MODEL;
    document.getElementById('input').placeholder = `Message ${MODEL}...`;

    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const statusEl = document.getElementById('status');

    const history = [];

    function setStatus(text, state) {
        statusEl.textContent = text;
        statusEl.dataset.state = state;
    }

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
    }

    /* ---- theme ---- */
    function currentTheme() {
        const explicit = document.documentElement.getAttribute('data-theme');
        if (explicit) return explicit;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function refreshThemeButton() {
        const dark = currentTheme() === 'dark';
        const btn = document.getElementById('themeBtn');
        btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
        btn.title = btn.getAttribute('aria-label');
        btn.querySelector('use').setAttribute('href', dark ? '#i-sun' : '#i-moon');
    }

    document.getElementById('themeBtn').addEventListener('click', () => {
        const next = currentTheme() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('dashboardTheme', next); } catch (e) { /* ignore */ }
        refreshThemeButton();
    });

    window.matchMedia('(prefers-color-scheme: dark)')
        .addEventListener('change', refreshThemeButton);

    refreshThemeButton();

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        addMessage('user', text);
        history.push({ role: 'user', content: text });

        sendBtn.disabled = true;
        setStatus('thinking…', 'thinking');
        const replyEl = addMessage('assistant', '');

        try {
            const res = await fetch(OLLAMA_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: MODEL, messages: history, stream: true })
            });

            if (!res.ok || !res.body) {
                throw new Error(`Ollama returned ${res.status}`);
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullReply = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();

                for (const line of lines) {
                    if (!line.trim()) continue;
                    const chunk = JSON.parse(line);
                    if (chunk.message?.content) {
                        fullReply += chunk.message.content;
                        replyEl.textContent = fullReply;
                        messagesEl.scrollTop = messagesEl.scrollHeight;
                    }
                }
            }

            history.push({ role: 'assistant', content: fullReply });
            setStatus('idle', 'idle');
        } catch (err) {
            replyEl.classList.remove('assistant');
            replyEl.classList.add('error');
            replyEl.textContent = `Couldn't reach Ollama at ${OLLAMA_URL} — is it running? (${err.message})`;
            setStatus('error', 'error');
        } finally {
            sendBtn.disabled = false;
            input.focus();
        }
    });

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            form.requestSubmit();
        }
    });
</script>
</body>
</html>
